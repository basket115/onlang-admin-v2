# ONLANG Admin Panel V1.1 – Schritt 2
# Netlify-Konfiguration.
#
# Zwei Edge-Functions:
#   access  -> /api/access  (Schritt 1: Login/Session/Logout, Modul 02)
#   admin   -> /api/admin   (Schritt 2: abgesichertes Verein & Branding)
#
# Das Frontend spricht nur mit /api/access und /api/admin, nie direkt
# mit Google Apps Script (Plan A – Proxy).

[[edge_functions]]
  path = "/api/access"
  function = "access"

[[edge_functions]]
  path = "/api/admin"
  function = "admin"
